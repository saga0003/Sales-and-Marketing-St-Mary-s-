<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive workspace check</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9e5f1;
        font:
          14px system-ui,
          sans-serif;
        color: #29243a;
      }
      header {
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: #fff;
        border-bottom: 1px solid #ddd5ed;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      header p {
        font-size: 12px;
        color: #655c75;
        margin: 4px 0 0;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      button {
        padding: 9px 12px;
        border: 1px solid #d9d1e7;
        border-radius: 8px;
        background: #fff;
        color: #4b3b69;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #6b50e7;
        color: #fff;
        border-color: #6b50e7;
      }
      main {
        padding: 24px;
        display: flex;
        justify-content: center;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        max-width: 100%;
        border: 0;
        border-radius: 20px;
        box-shadow: 0 6px 40px #31234418;
        background: white;
      }
      a {
        color: #6547bc;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Responsive workspace check</h1>
        <p>Development-only harness · real iframe viewport · <a href="/">Open full workspace</a></p>
      </div>
      <nav aria-label="Preview viewport">
        <button data-width="390" aria-pressed="true">Mobile · 390 px</button
        ><button data-width="768" aria-pressed="false">Tablet · 768 px</button
        ><button data-width="1200" aria-pressed="false">Desktop · 1200 px</button>
      </nav>
    </header>
    <main><iframe id="preview" title="St. Mary’s responsive workspace" src="/"></iframe></main>
    <script>
      const frame = document.getElementById('preview');
      document.querySelectorAll('button[data-width]').forEach((button) =>
        button.addEventListener('click', () => {
          frame.style.width = `${button.dataset.width}px`;
          document
            .querySelectorAll('button[data-width]')
            .forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        }),
      );
    </script>
  </body>
</html>
